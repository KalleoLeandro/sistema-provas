server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /storybook {
        return 308 /storybook/;
    }

    # Cada arquivo do catálogo exige uma sessão master válida no back-end.
    location ^~ /storybook/ {
        auth_request /_storybook-access;
        alias /usr/share/nginx/storybook/;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location = /_storybook-access {
        internal;
        proxy_pass http://back-end:8080/design-system/acesso;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
    }

    location /api/ {
        proxy_pass http://back-end:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/questoes/ {
        client_max_body_size 48m;
        proxy_pass http://back-end:8080/questoes/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/questoes {
        client_max_body_size 48m;
        proxy_pass http://back-end:8080/questoes;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
}

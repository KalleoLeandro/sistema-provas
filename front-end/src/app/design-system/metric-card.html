<a class="metric-card" [routerLink]="link" [attr.aria-label]="value + ' — ' + description + '. ' + actionLabel">
  <div class="metric-card-content">
    <div><span class="metric-card-description">{{ description }}</span><strong class="metric-card-value">{{ value }}</strong></div>
    <svg class="metric-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3" /><rect x="9" y="2" width="6" height="4" rx="1" /><path d="M8 11h8M8 15h8M8 19h5" />
    </svg>
  </div>
  <div class="metric-card-footer"><span>{{ actionLabel }}</span><span aria-hidden="true">→</span></div>
</a>

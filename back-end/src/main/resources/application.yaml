spring:
  jackson:
    deserialization:
      # Campos inteiros, como o ano da turma, não podem truncar valores decimais.
      accept-float-as-int: false
  session:
    jdbc:
      initialize-schema: never
      table-name: sessoes
  application:
    name: esfinora

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

server:
  servlet:
    session:
      # Padrão antes do login; SessionService aplica o prazo de cada perfil.
      timeout: 1h
      persistent: false
      cookie:
        # Valor negativo produz cookie de sessão, sem Max-Age ou Expires.
        max-age: -1s
        http-only: true
        same-site: lax
